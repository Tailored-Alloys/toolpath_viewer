[package]
name = "toolpath_viewer"
version = "0.1.0"
edition = "2021"
description = "A high-performance toolpath viewer for manufacturing applications"
authors = ["Tailored Alloys", "Daniyal Khan"]

[dependencies]
# OpenGL bindings
gl = "0.14"
glutin = "0.31"
glutin-winit = "0.4"
winit = "0.29"
raw-window-handle = "0.5"

# GUI - egui with glow backend
egui = "0.27"
egui_glow = "0.27"
egui-winit = "0.27"
glow = "0.13"

# Linear algebra
nalgebra = "0.32"
nalgebra-glm = "0.18"

# File handling
flate2 = "1.0"  # For gzip/deflate decompression
zip = "2.2"     # For ZIP-compressed ILT files
byteorder = "1.5"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
log = "0.4"
env_logger = "0.10"

# Serialization (for config)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
criterion = "0.5"  # Benchmarking

[[bin]]
name = "toolpath_viewer"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
